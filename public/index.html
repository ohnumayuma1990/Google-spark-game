<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>8bit Retro Asset Manager Test Canvas</title>
  <style>
    body {
      background-color: #1a1a24;
      color: #e0e0e0;
      font-family: 'Courier New', Courier, monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }

    h1 {
      margin-top: 0;
      margin-bottom: 10px;
      color: #f4d03f;
      text-shadow: 2px 2px #000;
      font-size: 24px;
    }

    #canvas-container {
      position: relative;
      border: 4px solid #444;
      border-radius: 4px;
      box-shadow: 0 8px 16px rgba(0,0,0,0.5);
    }

    canvas {
      display: block;
      background-color: #2c3e50;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }

    .instructions {
      margin-top: 15px;
      background: #282c34;
      padding: 15px 20px;
      border-radius: 6px;
      border: 1px solid #444;
      max-width: 600px;
      width: 100%;
    }

    .instructions h2 {
      margin-top: 0;
      font-size: 16px;
      color: #61afef;
    }

    .instructions ul {
      margin: 5px 0;
      padding-left: 20px;
      line-height: 1.6;
    }

    .instructions li {
      font-size: 14px;
    }

    kbd {
      background-color: #333;
      border: 1px solid #666;
      border-radius: 3px;
      padding: 2px 6px;
      font-size: 12px;
      color: #fff;
    }
  </style>
</head>
<body>
  <h1>8bit レトロ効果音・ドット絵アセット検証</h1>
  <div id="canvas-container">
    <canvas id="gameCanvas" width="640" height="360"></canvas>
  </div>

  <div class="instructions">
    <h2>操作方法 / Key Controls</h2>
    <ul>
      <li><kbd>←</kbd> / <kbd>→</kbd> または <kbd>A</kbd> / <kbd>D</kbd>: キャラクター左右移動 (Move Left / Right)</li>
      <li><kbd>Space</kbd>: ジャンプ SE再生 (Jump Sound - <code>se_jump.wav</code>)</li>
      <li><kbd>C</kbd>: コイン獲得 SE再生 (Coin Sound - <code>se_coin.wav</code>)</li>
      <li><kbd>E</kbd>: 爆発 SE再生 (Explosion Sound - <code>se_explosion.wav</code>)</li>
    </ul>
    <p style="font-size: 12px; color: #aaa; margin-bottom: 0;">※ブラウザの音声再生制限のため、画面クリックまたはキー操作後に効果音が再生されます。</p>
  </div>

  <script type="module" src="../src/main.js"></script>
</body>
</html>
